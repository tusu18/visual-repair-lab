[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-repair-lab"
version = "7.0.0"
description = "Adaptive visual repair generation with independent grading and private evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.1,<3", "gymnasium>=1.0,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
visual-repair-lab = "visual_repair_lab.v7.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["visual_repair_lab*", "vision_sort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]
"visual_repair_lab.v7" = ["gui.html"]
